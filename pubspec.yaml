name: granizo
description: App de alertas de granizo con IA local para San Rafael, Mendoza
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Notificaciones locales
  flutter_local_notifications: ^17.2.3

  # Mapa y ubicación
  flutter_map: ^6.2.1
  latlong2: ^0.9.1
  geolocator: ^10.1.0

  # Networking y cache
  http: ^1.2.0
  path_provider: ^2.1.1

  # Procesamiento de imágenes (IA local)
  image: 3.3.0

  # Permisos
  permission_handler: ^11.3.1

  # Storage local
  shared_preferences: ^2.2.2

  # Compartir
  share_plus: ^7.2.1

  # UI
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/geojson/
